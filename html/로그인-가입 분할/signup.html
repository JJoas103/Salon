<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAIR RESERVE | 회원가입</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="signup-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fas fa-user-plus"></i> 신규 회원가입</div>
      <p style="font-size: 14px; color: var(--text-sub);">HAIR RESERVE 스마트 뷰티 시스템에 합류하세요</p>
    </div>
    <div class="role-selector-container">
      <label class="role-label">가입 유형 선택</label>
      <div class="role-radio-group">
        <input type="radio" id="reg-role-customer" name="reg-role" value="CUSTOMER" checked>
        <label for="reg-role-customer" class="role-radio-label">일반 회원</label>
        <input type="radio" id="reg-role-owner" name="reg-role" value="OWNER">
        <label for="reg-role-owner" class="role-radio-label">매장 점주</label>
      </div>
    </div>
    <div>
      <label class="role-label">이름 / 상호명</label>
      <div class="input-wrapper"><i class="far fa-user"></i><input type="text" class="auth-input" placeholder="홍길동 또는 매장명"></div>
    </div>
    <div>
      <label class="role-label">이메일 주소</label>
      <div class="input-wrapper"><i class="far fa-envelope"></i><input type="email" class="auth-input" placeholder="example@hair.com"></div>
    </div>
    <div>
      <label class="role-label">비밀번호 설정</label>
      <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" class="auth-input" placeholder="8자리 이상 안전한 비밀번호"></div>
    </div>
    <button class="btn-modern btn-primary" style="width: 100%; margin-top: 15px;">회원가입 완료하기</button>
    <div class="auth-footer">이미 계정이 있으신가요? <a href="login.html" class="auth-link">로그인</a></div>
  </div>
</body>
</html>
