# 업로드 파일 저장 경로
#  - 리포지토리 바깥이어야 한다. 리포 안이면 업로드된 파일이 git status 를 오염시킨다.
#  - webapp 바깥이어야 한다. webapp 안이면 WAR 재배포 시 파일이 사라진다.
#  - 배포 환경(특히 Linux)에서는 이 값을 고치지 말고 JVM 시스템 프로퍼티로 덮어쓴다.
#    시스템 프로퍼티가 이 파일보다 우선 적용된다:
#      CATALINA_OPTS="-Dupload.path=/var/lib/salu/upload"
#    Tomcat 실행 계정에 해당 디렉터리의 쓰기 권한이 있어야 한다.
